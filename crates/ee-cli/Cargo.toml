[package]
name = "ee-cli"
version = "0.11.2"
build = "build.rs"
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "Large file viewer and editor for the terminal, built on top of xi-core backend."
categories = ["text-editors", "command-line-utilities", "development-tools"]
homepage = "https://github.com/ffimnsr/ee"
repository = "https://github.com/ffimnsr/ee"
readme = "../../README.md"
keywords = ["text-editor", "terminal", "cli", "command-line", "editor"]
exclude = [".gitignore"]
edition.workspace = true
rust-version.workspace = true
autobenches = false
default-run = "ee"

[[bin]]
name = "ee"
path = "src/main.rs"

[features]
# Agents mode is opt-in at compile time; the default build ships no agent code.
default = []
agents = [
    "dep:ee-agent-protocol",
    "dep:ee-agent-host",
    "dep:ee-mcp",
    "dep:rmcp",
    "dep:tracing",
]

[dependencies]
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
dirs.workspace = true
ee-agent-host = { workspace = true, optional = true }
ee-agent-protocol = { workspace = true, optional = true }
ee-mcp = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server"], optional = true }
git2.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
keyring.workspace = true
libc.workspace = true
rand.workspace = true
ratatui.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
similar.workspace = true
tracing = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util.workspace = true
toml.workspace = true
unicode-width.workspace = true
url.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Registry"] }
zeroize.workspace = true
xi-lsp-lib.workspace = true
xi-rpc.workspace = true
xi-core-lib.workspace = true

[dev-dependencies]
criterion.workspace = true
ee-acp-agent-server = { workspace = true, features = ["test-utils"] }
ee-agent-host = { workspace = true, features = ["test-utils"] }
ee-agent-orchestrator.workspace = true
ee-mcp = { workspace = true, features = ["test-utils"] }
ee-openrouter-agent = { path = "../ee-openrouter-agent", features = ["test-utils"] }
futures.workspace = true
tempfile.workspace = true
xi-core-lib = { workspace = true, features = ["test-grammars"] }

[build-dependencies]
chrono.workspace = true

[[bench]]
name = "vlf"
harness = false
