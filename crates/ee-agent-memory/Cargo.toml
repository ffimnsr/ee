[package]
name = "ee-agent-memory"
version = "0.11.17"
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "Backend workspace-scoped durable fact memory for ee agents."
categories = ["development-tools"]
repository = "https://github.com/ffimnsr/ee"
edition.workspace = true
rust-version.workspace = true

[features]
# Build the bundled SQLite instead of linking the system library. CI and
# release artifacts enable this; local builds use pkg-config by default.
vendored = ["rusqlite/bundled"]

[dependencies]
serde.workspace = true
sha2.workspace = true
dirs.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
