[package]
name = "ee-plugin-example-wasm"
version = "0.11.18"
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
repository = "https://github.com/ffimnsr/ee"
description = "Reference Wasm guest plugin for the ee v2 plugin ABI."
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ee_plugin_example_wasm"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]

# Both dependencies are only used on the wasm32 guest target. Declaring them
# under the target table keeps host-target builds warning-free.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ee-plugin-sdk = { path = "../ee-plugin-sdk" }
serde_json.workspace = true
