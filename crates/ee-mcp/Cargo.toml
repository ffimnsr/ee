[package]
name = "ee-mcp"
version = "0.1.0"
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "MCP (Model Context Protocol) client integration for ee agents mode."
categories = ["development-tools"]
homepage = "https://github.com/ffimnsr/ee"
repository = "https://github.com/ffimnsr/ee"
edition.workspace = true
rust-version.workspace = true

[dependencies]
rmcp = { workspace = true, features = ["server"] }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "process", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
http = "1"
url = "2"
thiserror = "2"

[features]
test-utils = []

[dev-dependencies]
rmcp.workspace = true
tempfile.workspace = true
