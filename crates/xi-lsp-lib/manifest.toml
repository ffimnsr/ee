manifest_version = 1
name = "xi-lsp-plugin"
version = "0.0.0"
capabilities = ["edit", "hover", "status_items", "filesystem", "network"]
exec_path="./bin/xi-lsp-plugin"

[[commands]]
title = "Completion"
description = "Request editor completions"

[commands.rpc_cmd]
rpc_type = "notification"
method = "request_completion"
params = {}

[[commands]]
title = "Definition"
description = "Request definition locations"

[commands.rpc_cmd]
rpc_type = "notification"
method = "request_definition"
params = {}

[[commands]]
title = "Declaration"
description = "Request declaration locations"

[commands.rpc_cmd]
rpc_type = "notification"
method = "request_declaration"
params = {}

[[commands]]
title = "References"
description = "Request reference locations"

[commands.rpc_cmd]
rpc_type = "notification"
method = "request_references"
params = {}

[[commands]]
title = "Format Document"
description = "Format active document"

[commands.rpc_cmd]
rpc_type = "notification"
method = "format_document"
params = {}

[[commands]]
title = "Code Actions"
description = "Request or apply code actions"

[commands.rpc_cmd]
rpc_type = "notification"
method = "request_code_actions"
params = {}

[[commands]]
title = "Document Symbols"
description = "Request symbol outline for current file"

[commands.rpc_cmd]
rpc_type = "notification"
method = "request_document_symbols"
params = {}

[[commands]]
title = "Workspace Symbols"
description = "Search symbols across the workspace"

[[commands.args]]
title = "Query"
description = "Search term"
key = "query"
arg_type = "String"

[commands.rpc_cmd]
rpc_type = "notification"
method = "request_workspace_symbols"
params = { query = "" }

# Agent-tool commands. The editor sends these on behalf of the agent tool
# surface; the plugin answers on the agent-tool channel rather than the
# editor result queue.
[[commands]]
title = "Agent: Document Symbols"
description = "Answer an agent document-symbols request"

[commands.rpc_cmd]
rpc_type = "notification"
method = "ee.agent.document_symbols"
params = {}

[[commands]]
title = "Agent: References"
description = "Answer an agent references request"

[commands.rpc_cmd]
rpc_type = "notification"
method = "ee.agent.references"
params = {}

[[commands]]
title = "Agent: Code Actions"
description = "Answer an agent code-actions request"

[commands.rpc_cmd]
rpc_type = "notification"
method = "ee.agent.list_code_actions"
params = {}

[[commands]]
title = "Agent: Format Preview"
description = "Answer an agent format-preview request"

[commands.rpc_cmd]
rpc_type = "notification"
method = "ee.agent.format_preview"
params = {}

[[commands]]
title = "Agent: Rename Preview"
description = "Answer an agent rename-preview request"

[commands.rpc_cmd]
rpc_type = "notification"
method = "ee.agent.preview_rename"
params = {}
