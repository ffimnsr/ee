[package]
name = "ee-xi-lsp-lib"
version = "0.11.8"
license = "Apache-2.0"
repository = "https://github.com/ffimnsr/ee"
description = "The base library for implementing LSP Plugins for Xi"
authors = ["betterclever <paliwal.pranjal83@gmail.com>", "Edward Fitz Abucay <gh:ffimnsr>"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "xi_lsp_lib"

[dependencies]
lsp-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

jsonrpc-lite.workspace = true
fern.workspace = true
log.workspace = true
chrono.workspace = true
url.workspace = true
lsp-server = { workspace = true }
tokio-util = { workspace = true }
xi-plugin-lib.workspace = true
xi-core-lib.workspace = true
xi-rope.workspace = true
xi-rpc.workspace = true

# Hermetic grammars for the plugin binary when spawned by in-process tests:
# the plugin is a real (non-test) process, so it cannot use the app test
# binary's `cfg(test)` grammar preload; this feature forwards the same
# bundled test grammars so symbol/highlights paths never depend on user
# state-dir grammar artifacts.  Enabled only by the test harness build.
[features]
test-grammars = ["xi-core-lib/test-grammars"]

[[bin]]
name = "xi_lsp_fake_server"
path = "tests/support/fake_language_server.rs"
