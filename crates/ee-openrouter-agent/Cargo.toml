[package]
name = "ee-openrouter-agent"
version = "0.11.8"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "OpenRouter ACP agent provider built on the ee-acp-agent-server framework."

[features]
# Exposes hermetic scripted completions for cross-crate integration tests.
test-utils = []

[dependencies]
clap.workspace = true
dirs.workspace = true
ee-acp-agent-server.workspace = true
ee-agent-orchestrator.workspace = true
ee-agent-protocol.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[dev-dependencies]
ee-acp-agent-server = { workspace = true, features = ["test-utils"] }
ee-agent-protocol.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
