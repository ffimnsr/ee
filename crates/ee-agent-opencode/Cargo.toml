[package]
name = "ee-agent-opencode"
version = "0.11.12"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "OpenCode Zen and OpenCode Go ACP agent provider with exact (surface, model) protocol routing."

[features]
# Exposes the scripted dialect codec and test argument builder for cross-crate
# integration tests, mirroring `ee-agent-acp-server`'s `test-utils` convention.
test-utils = []

[dependencies]
clap.workspace = true
dirs.workspace = true
ee-agent-acp-server.workspace = true
ee-agent-orchestrator.workspace = true
ee-agent-protocol.workspace = true
ee-chat-completions.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[dev-dependencies]
# Self-dependency so the binary, the in-crate tests, and the integration tests
# all see the `test-utils` fixtures without a second ACP loop or transport.
ee-agent-opencode = { path = ".", features = ["test-utils"] }
ee-agent-acp-server = { workspace = true, features = ["test-utils"] }
ee-agent-orchestrator = { workspace = true, features = ["test-utils"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }
