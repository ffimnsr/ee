[package]
name = "ee-agent-host"
version = "0.11.2"
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "Agent host for ee agents mode: session lifecycle, approvals, and MCP startup."
categories = ["development-tools"]
homepage = "https://github.com/ffimnsr/ee"
repository = "https://github.com/ffimnsr/ee"
edition.workspace = true
rust-version.workspace = true

[features]
# In-process fake ACP agent transport used by tests (host and ee-cli).
test-utils = []

[dependencies]
ee-agent-protocol.workspace = true
ee-mcp.workspace = true
base64.workspace = true
futures.workspace = true
rmcp = { workspace = true, features = ["server"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process", "time", "net"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
ee-acp-agent-server = { workspace = true, features = ["test-utils"] }
ee-agent-host = { path = ".", features = ["test-utils"] }
# Test-only direction: live OpenRouter-orchestrated ACP provider exercised through host transport.
ee-agent-orchestrator = { path = "../ee-agent-orchestrator", features = ["test-utils"] }
ee-openrouter-agent = { path = "../ee-openrouter-agent", features = ["test-utils"] }
tempfile.workspace = true
