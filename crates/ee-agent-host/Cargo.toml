[package]
name = "ee-agent-host"
version = "0.11.15"
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "Agent host for ee agents mode: session lifecycle, approvals, and MCP startup."
categories = ["development-tools"]
repository = "https://github.com/ffimnsr/ee"
edition.workspace = true
rust-version.workspace = true

[features]
# In-process fake ACP agent transport used by tests (host and ee-cli).
test-utils = []
# Build vendored native libraries (SQLite) instead of using system ones.
vendored = ["ee-agent-memory/vendored"]

[dependencies]
ee-agent-protocol.workspace = true
ee-agent-orchestrator.workspace = true
ee-agent-memory.workspace = true
ee-mcp.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
rmcp = { workspace = true, features = ["server"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process", "time", "net"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
ee-agent-acp-server = { workspace = true, features = ["test-utils"] }
ee-agent-host = { path = ".", features = ["test-utils"] }
# Live replay tests need orchestrator deterministic fakes.
ee-agent-orchestrator = { path = "../ee-agent-orchestrator", features = ["test-utils"] }
ee-agent-openrouter = { path = "../ee-agent-openrouter", features = ["test-utils"] }
ee-chat-completions = { path = "../ee-chat-completions" }
rusqlite.workspace = true
tempfile.workspace = true

[[test]]
name = "host_flows"
path = "tests/host_flows/mod.rs"
