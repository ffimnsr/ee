[package]
name = "ee-chat-completions"
version = "0.11.13"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "Provider-neutral OpenAI-compatible Chat Completions transport, codec, and normalized model adapter."

[dependencies]
ee-agent-acp-server.workspace = true
ee-agent-orchestrator.workspace = true
flate2.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing.workspace = true
url.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }
