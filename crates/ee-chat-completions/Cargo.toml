[package]
name = "ee-chat-completions"
version = "0.11.10"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "Provider-neutral OpenAI-compatible Chat Completions transport, codec, and normalized model adapter."

[dependencies]
ee-acp-agent-server.workspace = true
ee-agent-orchestrator.workspace = true
