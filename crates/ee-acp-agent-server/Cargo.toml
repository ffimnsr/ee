[package]
name = "ee-acp-agent-server"
version = "0.11.1"
license = "Apache-2.0"
authors = ["Edward Fitz Abucay <gh:ffimnsr>"]
description = "Reusable ACP v1 agent-side server framework: stdio/memory transports, framing, IDs, config, and errors for provider binaries."
categories = ["development-tools"]
homepage = "https://github.com/ffimnsr/ee"
repository = "https://github.com/ffimnsr/ee"
edition.workspace = true
rust-version.workspace = true

[features]
# In-process fake ACP agent transport used by tests without spawning
# real subprocesses (mirrors `ee-agent-host`'s `test-utils` convention).
test-utils = []

[dependencies]
ee-agent-protocol.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
ee-acp-agent-server = { path = ".", features = ["test-utils"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync", "test-util", "time"] }
