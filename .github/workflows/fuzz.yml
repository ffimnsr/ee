name: Fuzz

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - ee_mcp_proxy_arguments
          - ee_plugin_wasm
          - xi_core_config
          - xi_core_text
          - xi_lsp_transport
          - xi_rope_compare
          - xi_rope_crdt
          - xi_rpc_parse
          - xi_unicode_text
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run fuzz target
        shell: bash
        run: |
          set -euo pipefail

          # cargo-fuzz derives its default --target from the platform it was built
          # for, and the only prebuilt Linux binary is x86_64-unknown-linux-musl.
          # That makes it cross-build fuzz targets for musl, where ASan cannot
          # link against a static libc. Pin the runner's host triple explicitly.
          host_triple="$(rustc +nightly -vV | sed -n 's/^host: //p')"

          cargo +nightly fuzz run --target "${host_triple}" "${{ matrix.target }}" -- \
            -max_total_time=60 -timeout=30
