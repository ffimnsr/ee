name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Lint check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Job-scoped: `shared-key` replaces the automatic job-based key, so a
          # single shared value makes jobs race to save the same cache entry.
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"
          # Clippy artifacts are never reused by other jobs; skip caching them
          # so the repo cache quota stays available for sccache objects.
          cache-targets: "false"

      - name: Configure cargo jobs
        uses: ./.github/actions/cargo-jobs

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: Documentation check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"
          # rustdoc output is never reused elsewhere.
          cache-targets: "false"

      - name: Configure cargo jobs
        uses: ./.github/actions/cargo-jobs

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  catalog:
    name: Catalog reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The generated tables are checked in, so a snapshot change that is not
      # regenerated must fail here instead of shipping a stale catalog.
      - name: Check OpenCode catalog
        working-directory: crates/ee-agent-opencode
        run: python3 scripts/gen_catalog.py --check

      - name: Check OpenRouter catalog
        working-directory: crates/ee-agent-openrouter
        run: python3 scripts/gen_catalog.py --check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          # Pinned: the GHA cache namespace is keyed to the sccache version
          # (`sccache-v<version>`), so floating it silently resets every cache.
          version: v0.20.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"

      - name: Configure cargo jobs
        uses: ./.github/actions/cargo-jobs

      - name: Build project
        run: cargo build --workspace --locked --features ee-cli/vendored

      - name: Build wasm32 plugin example
        run: cargo build --quiet --locked -p ee-plugin-example-wasm --target wasm32-unknown-unknown --release

      - name: Check generated config schema
        # Reuse the binary built above; `cargo run` would resolve a second
        # feature graph and recompile crates sccache already cached.
        run: ./target/debug/ee do schema check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Serialize behind Build so sccache can serve the shared dev-profile
    # dependency objects instead of both jobs compiling them concurrently.
    needs: build
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Set up mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          # Pinned: the GHA cache namespace is keyed to the sccache version
          # (`sccache-v<version>`), so floating it silently resets every cache.
          version: v0.20.1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"

      - name: Configure cargo jobs
        uses: ./.github/actions/cargo-jobs

      - name: Run tests
        run: cargo test --workspace --locked --features ee-cli/vendored

      - name: Run secrets-store regression tests
        run: |
          cargo test -p ee-cli --locked --features vendored secrets
          cargo test -p ee-cli --locked --all-features secrets

      - name: Run deterministic LLM harness baseline gate
        run: cargo test --quiet -p ee-agent-orchestrator --features test-utils --locked evaluation

      - name: Run Phase 6 pane fixture matrix gate
        run: |
          cargo test --quiet -p ee-cli --features agents,vendored --locked phase_six_fixture_matrix
          cargo test --quiet -p ee-cli --features agents,vendored --locked phase_six_live_openrouter_pane_write_collects_post_write_evidence

      - name: Run OpenRouter ACP host-transport integration gate
        run: cargo test --quiet -p ee-agent-host --test orchestrated_replay --features vendored --locked

  test-all-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Manual only for now: a full all-features compile plus run is the most
    # expensive job in the workflow. Run it from the Actions tab (or
    # `gh workflow run ci.yml`) when touching feature-gated code paths.
    if: github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          # Pinned: the GHA cache namespace is keyed to the sccache version
          # (`sccache-v<version>`), so floating it silently resets every cache.
          version: v0.20.1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"

      - name: Configure cargo jobs
        uses: ./.github/actions/cargo-jobs

      # clippy and rustdoc only compile feature-gated code; this runs it.
      - name: Run tests with all features
        run: cargo test --workspace --all-features --locked
