name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Lint check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Job-scoped: `shared-key` replaces the automatic job-based key, so a
          # single shared value makes jobs race to save the same cache entry.
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: Documentation check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"

      - name: Build project
        run: cargo build --workspace --locked

      - name: Build wasm32 plugin example
        run: cargo build --quiet --locked -p ee-plugin-example-wasm --target wasm32-unknown-unknown --release

      - name: Check generated config schema
        run: cargo run -p ee-cli --locked -- do schema check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run secrets-store regression tests
        run: |
          cargo test -p ee-cli --locked secrets
          cargo test -p ee-cli --locked --all-features secrets

      - name: Run deterministic LLM harness baseline gate
        run: cargo test --quiet -p ee-agent-orchestrator --features test-utils evaluation

      - name: Run Phase 6 pane fixture matrix gate
        run: |
          cargo test --quiet -p ee-cli --features agents --locked phase_six_fixture_matrix
          cargo test --quiet -p ee-cli --features agents --locked phase_six_live_openrouter_pane_write_collects_post_write_evidence

      - name: Run OpenRouter ACP host-transport integration gate
        run: cargo test --quiet -p ee-agent-host --test orchestrated_replay --locked

  test-all-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Manual only for now: a full all-features compile plus run is the most
    # expensive job in the workflow. Run it from the Actions tab (or
    # `gh workflow run ci.yml`) when touching feature-gated code paths.
    if: github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ github.job }}-${{ runner.os }}
          cache-on-failure: "true"

      # clippy and rustdoc only compile feature-gated code; this runs it.
      - name: Run tests with all features
        run: cargo test --workspace --all-features --locked
