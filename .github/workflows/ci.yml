name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Lint check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: Documentation check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Check formatting
        run: cargo fmt --all --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Build project
        run: cargo build --all

      - name: Check generated config schema
        run: cargo run -p ee-cli --locked -- do schema check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ee-rust-${{ runner.os }}
          cache-on-failure: "true"

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run secrets-store regression tests (phases 1-6)
        run: |
          cargo test -p ee-cli --locked secrets
          cargo test -p ee-cli --locked --all-features secrets

      - name: Run deterministic LLM harness baseline gate (phase 8)
        run: cargo test --quiet -p ee-agent-orchestrator --features test-utils evaluation

      - name: Run Phase 6 pane fixture matrix gate
        run: |
          cargo test --quiet -p ee-cli --features agents --locked phase_six_fixture_matrix
          cargo test --quiet -p ee-cli --features agents --locked phase_six_live_openrouter_pane_write_collects_post_write_evidence

      - name: Run OpenRouter ACP host-transport integration gate
        run: cargo test --quiet -p ee-agent-host --test orchestrated_replay --locked
