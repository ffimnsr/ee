# yaml-language-server: $schema=https://raw.githubusercontent.com/ffimnsr/mk-rs/main/docs/schema.json

use_cargo: true

tasks:
  format:
    commands:
      - cargo fmt --all
    description: Format the code using rustfmt.
  lint:
    commands:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
    description: Lint the code using clippy, treating warnings as errors.
  test-stable:
    commands:
      - cargo +stable test --workspace --all-features
    description: Run tests using the stable Rust toolchain.
  ci:
    commands:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - cargo test --quiet --workspace --all-features --locked
      - ./.githooks/record-tests-pass
    description: Full CI-equivalent gate (format, lint, docs, tests); records the test pass so the pre-commit hook skips its own run.
  docs-check:
    commands:
      - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
    description: Check that documentation builds without errors.
  install:
    commands:
      - cargo install --root "$HOME/.local" --path crates/ee-cli --bin ee --all-features --force
      - cargo install --root "$HOME/.local" --path crates/ee-openrouter-agent --bin ee-openrouter-agent --force
      - name: Install bundled tree-sitter runtime
        command: ./scripts/install-tree-sitter-runtime.sh --force
      - name: Install bundled plugins
        command: ./scripts/install-plugins.sh --force
    description: Install ee-editor and OpenRouter ACP agent at ~/.local/bin using cargo, replacing previous installs.
  uninstall:
    commands:
      - pkill -TERM -f '[x]i-lsp-plugin' || true
      - pkill -TERM -x ee || true
      - pkill -TERM -x ee-openrouter-agent || true
      - cargo uninstall ee-cli 2>/dev/null || true
      - cargo uninstall ee-openrouter-agent 2>/dev/null || true
      - cargo uninstall --root "$HOME/.local" ee-cli 2>/dev/null || true
      - cargo uninstall --root "$HOME/.local" ee-openrouter-agent 2>/dev/null || true
      - rm -f "$HOME/.local/bin/ee" "$HOME/.local/bin/ee-openrouter-agent" "$HOME/.cargo/bin/ee" "$HOME/.cargo/bin/ee-openrouter-agent"
      - rm -rf "${XDG_CONFIG_HOME:-$HOME/.config}/ee"
      - rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/ee"
      - rm -rf "${XDG_STATE_HOME:-$HOME/.local/state}/ee"
      - rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/doc/ee" "${XDG_DATA_HOME:-$HOME/.local/share}/licenses/ee"
      - sed -i '\|eval "$(ee do completions |d' "$HOME/.bashrc" "$HOME/.zshrc" 2>/dev/null || true
      - sed -i '\|eval "$(ee completions |d' "$HOME/.bashrc" "$HOME/.zshrc" 2>/dev/null || true
      - rm -f "${XDG_CONFIG_HOME:-$HOME/.config}/fish/completions/ee.fish"
    description: Remove ee binaries, plugins, runtime assets, user config, logs, sessions, cached workspace memory, and shell completion hooks. Deletes the secrets vault too.
  install-githooks:
    commands:
      - rm -rf .git/hooks
      - mkdir -p .git/hooks
      - cp -r .githooks/* .git/hooks/
    description: Install git hooks from the .githooks directory.
  logs:
    commands:
      - |
        set -eu

        editor_log=""
        for candidate in \
          "${EE_EDITOR_LOG:-}" \
          "$PWD/ee.log" \
          "$PWD/editor.log" \
          "${XDG_STATE_HOME:-$HOME/.local/state}/ee/editor.log" \
          "$HOME/Library/Application Support/ee/editor.log"
        do
          if [ -n "$candidate" ] && [ -f "$candidate" ]; then
            editor_log="$candidate"
            break
          fi
        done

        plugin_log=""
        for candidate in \
          "${EE_PLUGIN_LOG:-}" \
          "$PWD/xi-lsp-plugin.log" \
          "${XDG_STATE_HOME:-$HOME/.local/state}/ee/xi-lsp-plugin.log" \
          "$HOME/Library/Application Support/ee/xi-lsp-plugin.log"
        do
          if [ -n "$candidate" ] && [ -f "$candidate" ]; then
            plugin_log="$candidate"
            break
          fi
        done

        if [ -z "$editor_log" ] && [ -z "$plugin_log" ]; then
          printf '%s\n' \
            "No editor/plugin logs found." \
            "Checked EE_EDITOR_LOG, EE_PLUGIN_LOG, $PWD/{ee.log,editor.log,xi-lsp-plugin.log}, XDG state dir, and mac app-support dir." >&2
          exit 1
        fi

        if [ -n "$editor_log" ] && [ -n "$plugin_log" ]; then
          cargo run -p ee-cli -- "$editor_log" "$plugin_log"
        elif [ -n "$editor_log" ]; then
          cargo run -p ee-cli -- "$editor_log"
        else
          cargo run -p ee-cli -- "$plugin_log"
        fi
    description: Open discovered editor and plugin logs in ee.
  config-nearest:
    commands:
      - |
        set -eu

        dir="$PWD"
        config_path=""
        while [ "$dir" != "/" ]; do
          candidate="$dir/.ee.toml"
          if [ -f "$candidate" ]; then
            config_path="$candidate"
            break
          fi
          dir="$(dirname "$dir")"
        done

        if [ -z "$config_path" ]; then
          xdg_config="${XDG_CONFIG_HOME:-$HOME/.config}/ee/config.toml"
          legacy_config="$HOME/.ee.toml"
          if [ -f "$xdg_config" ]; then
            config_path="$xdg_config"
          elif [ -f "$legacy_config" ]; then
            config_path="$legacy_config"
          else
            mkdir -p "$(dirname "$xdg_config")"
            : > "$xdg_config"
            config_path="$xdg_config"
          fi
        fi

        cargo run -p ee-cli -- "$config_path"
    description: Open nearest workspace config, or user config fallback, in ee.
  uninstall-githooks:
    commands:
      - rm -rf .git/hooks
    description: Uninstall git hooks by removing the .git/hooks directory.
  lf:
    commands:
      - |
        git ls-files -z --cached --others --exclude-standard -- '*.rs' ':(exclude)test_assets/**' \
        | xargs -0 -I{} sh -c '[ -f "$1" ] && wc -l -- "$1"' sh {} \
        | awk '$1 > 1000' \
        | sort -nr
    description: Check for Rust files with more than 1000 LOC.
