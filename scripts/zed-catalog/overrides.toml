# Curated per-language data for the Zed language catalog sync.
#
# The generator merges this file with doc-extracted facts ("Tree-sitter:" /
# "Language Server:" bullets). Docs give grammar repo + LSP name; this file
# supplies what docs omit: binary command/args, routing, file types, aliases,
# query-language mapping, comment metadata, git rev fallbacks, and deferrals.
#
# Language keys are the doc slugs (doc file name without .md).

# ---------------------------------------------------------------------------
# Deferred languages: recorded in manifest, never emitted into Rust.
# ---------------------------------------------------------------------------
[languages.diff]
file_types = ["diff", "patch"]

[languages.gdscript]
defer = true
reason = "godot LSP binary/env varies per project; grammar alone insufficient"

[languages.glsl]
defer = true
reason = "no stable LSP binary; GLSL is often injected into shader strings"

[languages.groovy]
defer = true
reason = "no stable LSP binary"

[languages.makefile]
filenames = [
    "Makefile", "makefile", "GNUmakefile", "gnumakefile",
    "BSDmakefile", "bsdmakefile",
]
file_types = ["mk", "mak"]
query_language = "make"
line_comment = "#"

[languages.powershell]
defer = true
reason = "PowerShellEditorServices wrapper is environment-specific"

[languages.roc]
defer = true
reason = "no bundled queries, fringe grammar"

[languages.uiua]
defer = true
reason = "no bundled queries, fringe grammar"

[languages.csharp]
defer_lsp = true
reason_lsp = "omnisharp requires dotnet/roslyn plugin environment; grammar already builtin"

[languages.ansible]
query_language = "yaml"
file_types = ["ansible"]

[servers.ansible-language-server]
language_name = "Ansible"
command = "ansible-language-server"
args = ["--stdio"]
extensions = []
filenames = []
supports_single_file = true
workspace_identifier = ""

# ---------------------------------------------------------------------------
# Query-language and file-type corrections
# ---------------------------------------------------------------------------
[languages.terraform]
file_types = ["tf", "tfvars"]
query_language = "hcl"
line_comment = "//"
block_comment = ["/*", "*/"]
indentation = "treesitter"
attach_lsp = "terraform-ls"

[languages.opentofu]
file_types = ["tofu"]
query_language = "hcl"
line_comment = "//"
block_comment = ["/*", "*/"]
indentation = "treesitter"
attach_lsp = "terraform-ls"

[languages.helm]
file_types = ["tpl"]
query_language = "helm"
# tree-sitter-go-template ships `go-template` (root) and `go-template-helm`
# (dialects/helm) grammars in one repo; select_manifest_grammar picks the
# `-helm` dialect by suffix, which exports `tree_sitter_helm`.
symbol = "tree_sitter_helm"

[languages.proto]
query_language = "protobuf"

[languages.just]
grammar_url = "https://github.com/IndianBoy42/tree-sitter-just"
filenames = ["Justfile", "justfile"]
query_language = "just"
line_comment = "#"
indentation = "treesitter"
attach_lsp = "just"

[languages.docker]
query_language = "dockerfile"
file_types = []
filenames = ["Dockerfile", "Containerfile"]
globs = ["**/Dockerfile*", "**/Containerfile*"]
attach_lsp = "dockerfile"

# ---------------------------------------------------------------------------
# LSP servers: new bundled servers (command/args/routing/init).
# `attach` reuses an already-bundled server id.
# ---------------------------------------------------------------------------
[languages.gleam]
file_types = ["gleam"]
line_comment = "//"
indentation = "treesitter"
attach_lsp = "gleam"

[languages.kotlin]
file_types = ["kt", "kts"]
line_comment = "//"
indentation = "treesitter"
attach_lsp = "kotlin-language-server"

[languages.lua]
