[workspace]
resolver = "3"
members = [
  "crates/ee-acp-agent-server",
  "crates/ee-agent-host",
  "crates/ee-agent-orchestrator",
  "crates/ee-agent-protocol",
  "crates/ee-cli",
  "crates/ee-mcp",
  "crates/ee-openrouter-agent",
  "crates/ee-ts-test-grammars",
  "crates/xi-core-lib",
  "crates/xi-core",
  "crates/xi-lsp-lib",
  "crates/xi-plugin-derive",
  "crates/xi-plugin-lib",
  "crates/xi-rope",
  "crates/xi-rpc",
  "crates/xi-unicode",
]
default-members = ["crates/ee-cli"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_elicitation", "unstable_end_turn_token_usage", "unstable_mcp_over_acp"] }
bytecount = "0.6.9"
rmcp = { version = "3.1.0", default-features = false, features = ["client", "elicitation", "macros", "transport-child-process", "transport-streamable-http-client-reqwest"] }
cc = "1.2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
chrono = "0.4.44"
criterion = "0.8.2"
crossterm = "0.28"
dirs = "6.0.0"
fern = "0.6.2"
fs2 = "0.4"
futures = "0.3"
git2 = { version = "0.20.4", features = ["vendored-openssl"] }
jsonrpc-lite = "0.7.0"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
libc = "0.2.186"
log = "0.4.29"
memchr = "2.8.0"
notify = "6"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
jsonschema = "0.30"
rand = "0.9"
ratatui = "0.29"
regex = "1.12.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
schemars = { version = "1.0", features = ["derive"] }
semver = "1.0"
signal-hook = "0.3"
similar = "3.2.0"
serde = "1.0.228"
serde_json = "1.0.149"
seccompiler = "0.5.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time", "net"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "1.1.4"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-loader = "0.26.8"
tree-sitter-php = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-scala = "0.26.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-segmentation = "1.13.2"
# Ratatui 0.29 requires exactly 0.2.0; upgrade this with Ratatui.
unicode-width = "=0.2.0"
url = "2.5.8"
wasmtime = { version = "44.0.0", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
# Secrets store (ISSUES.md "Host-Bound Encrypted Secrets Store", phases 1-6).
# Phase 1 uses `zeroize`; the rest are declared for phases 2-3 and are added
# to crate dependencies as the implementation lands.
base64 = "0.22"
chacha20poly1305 = "0.10.1"
# Keyring v4 `v1` facade uses native stores plus persistent Zbus Secret Service
# on Linux; kernel-keyring entries are cleared at reboot.
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
sha2 = "0.10.9"
zeroize = "1.8.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

ee-acp-agent-server = { package = "ee-acp-agent-server", path = "crates/ee-acp-agent-server", version = "0.11.2" }
ee-agent-host = { package = "ee-agent-host", path = "crates/ee-agent-host", version = "0.11.2" }
ee-agent-orchestrator = { package = "ee-agent-orchestrator", path = "crates/ee-agent-orchestrator", version = "0.11.2" }
ee-agent-protocol = { package = "ee-agent-protocol", path = "crates/ee-agent-protocol", version = "0.11.2" }
ee-mcp = { package = "ee-mcp", path = "crates/ee-mcp", version = "0.11.2" }
xi-core-lib = { package = "ee-xi-core-lib", path = "crates/xi-core-lib", version = "0.11.2" }
xi-plugin-derive = { package = "ee-xi-plugin-derive", path = "crates/xi-plugin-derive", version = "0.11.2" }
xi-plugin-lib = { package = "ee-xi-plugin-lib", path = "crates/xi-plugin-lib", version = "0.11.2" }
xi-rope = { package = "ee-xi-rope", path = "crates/xi-rope", version = "0.11.2" }
xi-rpc = { package = "ee-xi-rpc", path = "crates/xi-rpc", version = "0.11.2" }
xi-unicode = { package = "ee-xi-unicode", path = "crates/xi-unicode", version = "0.11.2" }
xi-lsp-lib = { package = "ee-xi-lsp-lib", path = "crates/xi-lsp-lib", version = "0.11.2" }
